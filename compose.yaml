x-content: &content
  image: studyhub-content:local
  build:
    context: ./content-service

x-synthesis: &synthesis
  image: studyhub-synthesis:local
  build:
    context: ./synthesis-service
  environment:
    DATABASE_URL: postgresql://${SYNTHESIS_DB_USER:-synthesis}:${SYNTHESIS_DB_PASSWORD:-synthesis_dev}@synthesis-db:5432/${SYNTHESIS_DB:-synthesis_db}
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
    RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    CONTENT_SERVICE_URL: http://content-api:8000
    STUDYHUB_SYNTHESIS_TOKEN: ${STUDYHUB_SYNTHESIS_TOKEN:-}
    STUDYHUB_DEV_IDENTITY: ${STUDYHUB_DEV_IDENTITY:-0}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    AI_MODEL: ${AI_MODEL:-llama3.2:1b}
    DOCUMENT_PROVIDER: ${DOCUMENT_PROVIDER:-search}
    MOCK_DOCUMENTS_FILE: ${MOCK_DOCUMENTS_FILE:-}
    SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-}
    STUDYHUB_SEARCH_TOKEN: ${STUDYHUB_SEARCH_TOKEN:-}
    RETRIEVAL_VERSION: ${RETRIEVAL_VERSION:-search-contract-pending-v1}
    AI_CONTEXT_SIZE: ${AI_CONTEXT_SIZE:-4096}
    AI_OUTPUT_TOKENS: ${AI_OUTPUT_TOKENS:-384}
    AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
    AI_SEED: ${AI_SEED:-42}
    AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
    AI_MAX_CALLS: ${AI_MAX_CALLS:-64}
    AI_MAX_SOURCE_BYTES: ${AI_MAX_SOURCE_BYTES:-2000000}
    AI_MAX_JOB_SECONDS: ${AI_MAX_JOB_SECONDS:-900}

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run setup first}
      POSTGRES_USER: ${POSTGRES_USER:?Run setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Run setup first}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Run setup first}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  content-migrate:
    <<: *content
    command: ["python", "migrate.py"]
    environment:
      STUDYHUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  content-api:
    <<: *content
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      STUDYHUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STUDYHUB_UPLOAD_DIR: /data/uploads
      STUDYHUB_DEV_IDENTITY: ${STUDYHUB_DEV_IDENTITY:-0}
      STUDYHUB_PROCESSING_TOKEN: ${STUDYHUB_PROCESSING_TOKEN:?Run setup first}
      STUDYHUB_SEARCH_TOKEN: ${STUDYHUB_SEARCH_TOKEN:?Run setup first}
      STUDYHUB_SYNTHESIS_TOKEN: ${STUDYHUB_SYNTHESIS_TOKEN:?Run setup first}
    volumes:
      - ./uploads:/data/uploads
    depends_on:
      content-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  content-relay:
    <<: *content
    command: ["python", "-u", "relay.py"]
    environment:
      STUDYHUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STUDYHUB_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
    depends_on:
      content-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ai-processing-worker:
    image: studyhub-ai-processing:local
    build:
      context: ./ai-processing-service
    # Opt in when the native model services are available on the host.
    profiles: [processing]
    environment:
      STUDYHUB_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      STUDYHUB_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      STUDYHUB_PROCESSING_TOKEN: ${STUDYHUB_PROCESSING_TOKEN:?Run setup first}
      AI_CONTENT_URL: http://content-api:8000
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-ollama}
      AI_SUMMARY_URL: ${AI_DOCKER_SUMMARY_URL:-http://host.docker.internal:11434/api/chat}
      AI_SUMMARY_MODEL: ${AI_SUMMARY_MODEL:-qwen3:4b}
      AI_SUMMARY_KEY: ${AI_SUMMARY_KEY:-}
      AI_EMBEDDING_URL: ${AI_DOCKER_EMBEDDING_URL:-http://host.docker.internal:11434/api/embed}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-m3}
      AI_EMBEDDING_KEY: ${AI_EMBEDDING_KEY:-}
      AI_TRANSCRIPTION_URL: ${AI_DOCKER_TRANSCRIPTION_URL:-http://host.docker.internal:8001/v1/audio/transcriptions}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-mlx-community/whisper-small-mlx}
      AI_TRANSCRIPTION_KEY: ${AI_TRANSCRIPTION_KEY:-}
      AI_HTTP_TIMEOUT: ${AI_HTTP_TIMEOUT:-300}
      AI_CHUNK_SIZE: ${AI_CHUNK_SIZE:-2000}
      AI_CHUNK_OVERLAP: ${AI_CHUNK_OVERLAP:-200}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_OLLAMA_CONTEXT: ${AI_OLLAMA_CONTEXT:-4096}
      AI_SUMMARY_MAX_TOKENS: ${AI_SUMMARY_MAX_TOKENS:-512}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      content-api:
        condition: service_healthy
    restart: unless-stopped

  synthesis-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${SYNTHESIS_DB:-synthesis_db}
      POSTGRES_USER: ${SYNTHESIS_DB_USER:-synthesis}
      POSTGRES_PASSWORD: ${SYNTHESIS_DB_PASSWORD:-synthesis_dev}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - synthesis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  synthesis-api:
    <<: *synthesis
    ports:
      - "127.0.0.1:8002:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ./synthesis-service/app:/app/app
      - ./synthesis-service/migrations:/app/migrations:ro
    depends_on:
      synthesis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  synthesis-worker:
    <<: *synthesis
    command: ["python", "-m", "app.messaging.consumer"]
    volumes:
      - ./synthesis-service/app:/app/app
    depends_on:
      synthesis-api:
        condition: service_healthy
      synthesis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  synthesis-outbox-relay:
    <<: *synthesis
    command: ["python", "-m", "app.messaging.outbox"]
    volumes:
      - ./synthesis-service/app:/app/app
    depends_on:
      synthesis-api:
        condition: service_healthy
      synthesis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  synthesis-recovery:
    <<: *synthesis
    command: ["python", "-m", "app.messaging.recovery"]
    volumes:
      - ./synthesis-service/app:/app/app
    depends_on:
      synthesis-api:
        condition: service_healthy
      synthesis-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  synthesis-postgres-data:
